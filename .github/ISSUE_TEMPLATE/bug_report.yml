name: Bug report
description: Report reproducible incorrect behavior in game-session.
title: "fix: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: For security vulnerabilities, use the private reporting link in SECURITY.md.
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe the observed behavior and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Include the smallest runnable code sample and exact commands.
      render: ts
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Versions
      description: game-session, React, Node.js, package manager, browser, and operating system.
      placeholder: game-session 0.1.0; React 19; Node 24; pnpm 12; Firefox 140; macOS 26
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Add stack traces, stored localStorage values with non-sensitive data, or other useful details.
